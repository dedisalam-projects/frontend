      <nz-avatar nzIcon="user" nzSize="small" class="mr-sm"></nz-avatar>
      <span>Admin User</span>
    </div>
    <nz-dropdown-menu #userMenu="nzDropdownMenu">
      <ul nz-menu>
        <li nz-menu-item routerLink="/profile"><i nz-icon nzType="user" class="mr-sm"></i> Profile</li>
        <li nz-menu-divider></li>
        <li nz-menu-item routerLink="/login"><i nz-icon nzType="logout" class="mr-sm"></i> Logout</li>
      </ul>
    </nz-dropdown-menu>
  </layout-default-header-item>
  
  <router-outlet></router-outlet>
